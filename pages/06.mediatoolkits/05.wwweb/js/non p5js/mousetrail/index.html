<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <title>Document</title>
    <style>
        #screensaver img {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin: auto;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: transparent;
    z-index: 100000;
    display: none;
    padding:40px
}
        .screen-visible {
        display:block !important
        }
    </style>
</head>
<body class="page-static">
    <p class="">test</p>
    <div id="screensaver">
        <img class="screen" src="https://www.aglitteringruin.com/wp-content/themes/glittering/assets/images/backgroundclock.svg">
        <img class="screen" id="big" src="https://www.aglitteringruin.com/wp-content/themes/glittering/assets/images/bighand.svg">
        <img class="screen" id="small" src="https://www.aglitteringruin.com/wp-content/themes/glittering/assets/images/smallhand.svg">
    </div>

    <script >
        // cursor follow
if ($(window).width() >= 1200) {
var text='A Glittering Ruin Sucked Upwards?'
//<![CDATA[
    const bodyHasClass = document.body.classList.contains(
    'page-static'
   );

if (bodyHasClass) {
function moveid(e,t,n){
    if(ns4)e.moveTo(t,n);else{e.style.left=t+"px";e.style.top=n+"px"}}
    function animate(e){x1=Xoff+(ie4||ie5?event.clientX+document.body.scrollLeft:e.pageX);
        y1=Yoff+(ie4||ie5?event.clientY+document.body.scrollTop:e.pageY)}
        function getidleft(e){if(ns4)return e.left;else return parseInt(e.style.left)}
        function getidtop(e){if(ns4)return e.top;else return parseInt(e.style.top)}
        function getwindowwidth(){if(ie4||ie5)return document.body.clientWidth+document.body.scrollLeft;
            else return window.innerWidth+pageXOffset}
            function movetxts(){for(i=text.length;i>1;i=i-1){
                if(getidleft(txtA[i-1])+txtw*2>=getwindowwidth()){
                    moveid(txtA[i-1],0,-1e3);moveid(txtA[i],0,-1e3)}
                    else moveid(txtA[i],getidleft(txtA[i-1])+txtw,getidtop(txtA[i-1]))}
                    moveid(txtA[1],x1,y1)}var delay=30;var Xoff=10;var Yoff=10;var txtw=10;
                    var beghtml='<font color="black"><b>';var endhtml="</b></font>";ns4=navigator.appName.indexOf("Netscape")>=0&&document.layers?true:false;ie4=document.all&&!document.getElementById?true:false;ie5=document.all&&document.getElementById?true:false;ns6=document.getElementById&&navigator.appName.indexOf("Netscape")>=0?true:false;
                    var txtA=new Array;text=text.split("");var x1=0;var y1=-1e3;var t="";for(i=1;i<=text.length;i++){t+=ns4?'<layer left="0" top="-100" width="'+txtw+'" name="txt'+i+'" height="1">':'<div id="txt'+i+'" style="position:absolute;top:-100px;left:0px;height:1px;width:'+txtw+';visibility:visible;">';t+=beghtml+text[i-1]+endhtml;t+=ns4?"</layer>":"</div>"}
                    document.write(t);window.onload=function(){for(i=1;i<=text.length;i++)txtA[i]=ns4?document.layers["txt"+i]:ie4?document.all["txt"+i]:document.getElementById("txt"+i);if(ns4)document.captureEvents(Event.MOUSEMOVE);document.onmousemove=animate;setInterval("movetxts()",delay)}//]]
}
}
// end cursor
  // screensaver atm after 6 sec
  var timeout;
   if ($(window).width() >= 900) {
  window.onmousemove = function(){
  
    clearTimeout(timeout);
    
    timeout = setTimeout(function(){
  
      $("#screensaver img").addClass('screen-visible');
    }, 6000);
    var a =  Math.floor(Math.random() * (350 - 0 + 1) + 0);
    var b =  Math.floor(Math.random() * (350 - 0 + 1) + 0);
    $("#big").css('transform', 'rotate(' + a + 'deg) scale(2)');
    $("#small").css('transform', 'rotate(' + b + 'deg) scale(2)');
  }
  window.addEventListener("mousemove", function() { 
      $("#screensaver img").removeClass('screen-visible');
   });
  
 }
    </script>
</body>
</html>
