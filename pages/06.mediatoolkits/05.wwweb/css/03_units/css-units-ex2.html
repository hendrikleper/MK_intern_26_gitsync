<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>CSS Demos | viewport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      div {
        height: 200px;
        width: 50vw;
        margin: 20px;
        border: 1px solid #000000;
      }

      .red {
        background-color: #ffcccc;
      }

      .green {
        background-color: #ccffcc;
      }

      .blue {
        background-color: #ccccff;
      }
    </style>
  </head>
  <body>
    <div class="red">
      <div class="green">
        <div class="blue"></div>
      </div>
    </div>
  </body>
</html>
