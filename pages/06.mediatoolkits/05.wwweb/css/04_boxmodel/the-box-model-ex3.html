<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>CSS Demos | the Box Model</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          margin: 0;
        }
        div {
          width: 200px;
          background-color: #ffccff;
          margin: 20px 0px;
          border: 5px solid #333;
          padding: 20px;
        }
        .b-box {
          box-sizing: border-box;
        }
    </style>
  </head>
  <body>
    <div>box 1</div>
    <img src="../images/pixelruler.png" alt="pixel ruler">
    <div class="b-box">box 2</div>
  </body>
</html>
