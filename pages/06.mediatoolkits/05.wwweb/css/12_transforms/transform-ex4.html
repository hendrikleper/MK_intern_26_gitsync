<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>CSS Demos | transform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      section {
        text-align: center;
      }
      img {
        width: 400px;
        transform: skew(50deg, 10deg);
      }
    </style>
  </head>
  <body>
    <section>
      <img src="../images/css3.jpg" alt="CSS3 Logo" />
    </section>
  </body>
</html>
