<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>CSS Demos | flexbox layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      .menu {
        background-color: #999;
        padding: 25px;
        height: 100vh;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .menu > div {
        background-color: #ffddff;
        border-radius: 5px;
        padding: 40px;
      }
      @media (max-width: 640px) {
        .menu {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <div>File</div>
      <div>Edit</div>
      <div>View</div>
      <div>Tools</div>
      <div>Help</div>
    </div>
  </body>
</html>
